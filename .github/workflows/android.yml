# ═══════════════════════════════════════════════════════════════════════════
#  Oliver-200 · сборка APK и прогон тестов ядра.
#  Раннер GitHub уже содержит Android SDK, поэтому модуль :app подключается
#  автоматически (см. settings.gradle.kts).
#  Подпись: OLIVER-200 · см. SIGNATURES.txt
# ═══════════════════════════════════════════════════════════════════════════
name: Сборка APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Тесты ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-core-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Тесты :core (без Android SDK)
        run: ./gradlew -Poliver.includeApp=false :core:test --stacktrace

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: APK
    runs-on: ubuntu-latest
    # Право на запись нужно только для публикации готового APK в Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Публичный client_id Microsoft (если задан в секретах)
        env:
          OLIVER_MS_CLIENT_ID: ${{ secrets.OLIVER_MS_CLIENT_ID }}
        run: |
          if [ -n "$OLIVER_MS_CLIENT_ID" ]; then
            echo "OLIVER_MS_CLIENT_ID=$OLIVER_MS_CLIENT_ID" >> "$GITHUB_ENV"
            echo "client_id задан"
          else
            echo "client_id не задан — вход в аккаунт будет отключён в этой сборке"
          fi

      - name: Отладочный APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Боевой APK (без подписи — ключей в репозитории нет)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Выгрузка APK как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: oliver-200-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Артефакты Actions скачиваются только из веб-интерфейса и только
      # авторизованным пользователем. Release даёт прямую ссылку, которую
      # можно открыть на телефоне и сразу поставить.
      - name: Подготовка файлов
        id: files
        run: |
          set -e
          N="${{ github.run_number }}"
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$DEBUG_APK" "dist/Oliver-200-${N}-debug.apk"
          REL_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1 || true)
          if [ -n "$REL_APK" ]; then
            cp "$REL_APK" "dist/Oliver-200-${N}-release-unsigned.apk"
          fi
          ls -la dist
          {
            echo "sha_debug=$(sha256sum "dist/Oliver-200-${N}-debug.apk" | cut -d" " -f1)"
            echo "size_debug=$(du -h "dist/Oliver-200-${N}-debug.apk" | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Публикация в Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="apk-latest"
          NOTES=$(cat <<EOF
          Автоматическая сборка из ветки \`${{ github.ref_name }}\`, коммит \`${{ github.sha }}\`.

          ## Какой файл ставить

          **\`Oliver-200-${{ github.run_number }}-debug.apk\`** — этот. Он подписан
          отладочным ключом, поэтому Android его установит. Полностью рабочий:
          выбор версии, скин по нику, шейдеры.

          \`...-release-unsigned.apk\` — **не устанавливается**: подписи нет,
          ключей в репозитории нет и быть не должно. Он нужен, когда вы
          подставите свой keystore (как — написано в README).

          ## Установка

          1. Скачать APK на телефон.
          2. Разрешить установку из этого источника (Android спросит сам).
          3. Открыть файл и установить.

          Вход в аккаунт Microsoft заработает после того, как в секреты
          репозитория добавите \`OLIVER_MS_CLIENT_ID\` — до этого кнопка входа
          отключена, остальные экраны работают.

          SHA-256 отладочного APK:
          \`${{ steps.files.outputs.sha_debug }}\`
          EOF
          )
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Oliver-200 · APK сборка #${{ github.run_number }}" \
            --notes "$NOTES" \
            --prerelease \
            --target "${{ github.sha }}" \
            dist/*.apk
          echo "Release опубликован:"
          gh release view "$TAG" --json url --jq .url
